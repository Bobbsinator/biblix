name: Biblix ISO bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: ISO bauen (Debian-13-Container)
        run: |
          docker run --rm --privileged -v "$PWD:/build" -w /build debian:trixie \
            bash -c "apt-get update && apt-get install -y live-build python3 && ./build.sh"

      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Biblix-1.0-amd64
          path: |
            Biblix-1.0-amd64.iso
            Biblix-1.0-amd64.iso.sha256
          compression-level: 0

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
