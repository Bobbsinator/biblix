# Biblix: Bootmenue des USB-Sticks
set default=0
set timeout=10
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi
loadfont $font

# Mit Secure Boot (lockdown=y) darf das signierte GRUB keine Zusatzmodule nachladen. Dann bleibt das
# grafische Menue leer und startet nicht. Darum dort das schlichte Textmenue, sonst das Biblix-Design.
if [ x$lockdown = xy ] ; then
    terminal_output console
    set color_normal=light-gray/black
    set color_highlight=black/light-cyan
else
    loadfont /boot/grub/live-theme/dejavu_regular_16.pf2
    loadfont /boot/grub/live-theme/dejavu_regular_24.pf2
    loadfont /boot/grub/live-theme/dejavu_bold_16.pf2
    loadfont /boot/grub/live-theme/dejavu_bold_24.pf2
    # 1080p, damit die Schrift auch auf 4K-Bildschirmen lesbar ist
    set gfxmode=1920x1080,auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    terminal_output gfxterm
    source /boot/grub/theme.cfg
fi
