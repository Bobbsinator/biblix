source /boot/grub/config.cfg

menuentry "Biblix starten" --class biblix --hotkey=b {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# Notfall: ohne NVIDIA-Treiber und ohne Grafikmodus des Kernels (einfache Grafik, kommt immer auf den Desktop)
menuentry "Biblix starten (sichere Grafik)" --class safe --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nouveau
	initrd	@INITRD_LIVE@
}

if @ENABLE_VERIFY_CHECKSUMS@; then
menuentry "USB-Stick auf Fehler prüfen" --class check --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
	initrd	@INITRD_LIVE@
}
fi

if [ "${grub_platform}" = "efi" ]; then
menuentry "UEFI-Einstellungen (BIOS)" --class efi --hotkey=u {
	fwsetup
}
fi
