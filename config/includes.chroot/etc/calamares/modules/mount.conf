# Biblix: Einhaengen im Installer (Grundlage: calamares-settings-debian 13)
# Zusaetzlich zu Debian: Btrfs-Unterteile fuer Schnappschuesse und schonende Einhaenge-Optionen.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]

# System (@) und Benutzerdaten (@home) getrennt: ein Zurueckdrehen des Systems laesst deine Dateien in Ruhe.
# Logs, Caches und Swap liegen ausserhalb der Schnappschuesse (sonst wachsen sie unnoetig).
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log
btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
    - filesystem: ext4
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
