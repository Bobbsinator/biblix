# Biblix: Partitionierung im Installer
# Btrfs ist Standard: Biblix macht damit vor jedem Update einen Schnappschuss (Snapper) und kann ein
# kaputtes Update in der Haustechnik unter "Zeitmaschine" zurueckdrehen. ext4 bleibt waehlbar.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: "EFI"

userSwapChoices:
    - none
    - file

initialSwapChoice: file
initialPartitioningChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]
