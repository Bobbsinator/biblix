; GameMode unter Biblix: beim Spielstart CPU auf Leistung, Spiel bekommt Vorrang
[general]
desiredgov=performance
softrealtime=auto
renice=10
ioprio=0
inhibit_screensaver=1

[gpu]
; GPU-Uebertaktung bleibt aus. Dafuer gibt es LACT im S-Launcher.
apply_gpu_optimisations=0

[custom]
start=notify-send -a GameMode "GameMode an" "Leistung voraus. AUF BIBLIX GEHT DAS."
end=notify-send -a GameMode "GameMode aus"
