# Bibiplexx: mpv-Einstellungen (werden mit --include geladen, eigene mpv.conf bleibt unberuehrt)
osc=no
osd-bar=no
fullscreen=yes
keep-open=no
hwdec=auto-safe
vo=gpu-next
# HDR an KDE Plasma (Wayland) weiterreichen, wenn der Bildschirm HDR an hat
target-colorspace-hint=yes
volume-max=100
cursor-autohide=1500
osd-font="DejaVu Sans"
sub-font="DejaVu Sans"
sub-border-size=2.5
sub-shadow-offset=1
# Sprachen, Untertitel und Groesse setzt die App je nach Einstellung
title=Bibiplexx – ${media-title}
