GRUB_DISTRIBUTOR="Biblix"
# Bootmenue: Biblix ist Standard, Windows per Menue oder Knopf "Neustart in Windows".
# "saved": normalerweise der erste Eintrag. Fehlt einem neuen Kernel der NVIDIA-Treiber,
# merkt sich biblix-kernel-grafik den bisherigen Kernel (grub-set-default), bis der neue passt.
GRUB_DEFAULT=saved
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_THEME=/usr/share/grub/themes/biblix/theme.txt
# 1080p im Menue: auf 4K-Bildschirmen sonst winzige Schrift
GRUB_GFXMODE=1920x1080,auto
GRUB_GFXPAYLOAD_LINUX=keep
# resume=... (Ruhezustand) traegt der Installer in /etc/default/grub ein: hier uebernehmen statt ueberschreiben
biblix_resume=$(printf '%s\n' "$GRUB_CMDLINE_LINUX_DEFAULT" | tr ' ' '\n' | grep '^resume=' | head -n1)
# loglevel=3 und Co.: beim Start nur kritische Meldungen, z. B. kein "RDSEED32 is broken" (harmloser Zen-5-Hinweis)
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto nowatchdog amd_pstate=active nvidia-drm.modeset=1 nvidia-drm.fbdev=1 amdgpu.ppfeaturemask=0xffffffff $biblix_resume"
unset biblix_resume
# Dual-Boot: andere Systeme (Windows) im Bootmenue anzeigen
GRUB_DISABLE_OS_PROBER=false
