# Biblix: mpv in hoher Qualitaet
# Beste Skalierung und Farbdarstellung, Dekodierung ueber die Grafikkarte
profile=high-quality
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
# HDR-Videos als HDR an den Bildschirm geben (wenn HDR in Plasma an ist)
target-colorspace-hint=yes
# Bildwiederholrate an das Video anpassen, gegen Ruckler
video-sync=display-resample
interpolation=yes
tscale=oversample
# Bedienung
keep-open=yes
save-position-on-quit=yes
screenshot-format=png
slang=de,ger,deu,en,eng
alang=de,ger,deu,en,eng
