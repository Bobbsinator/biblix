# Biblix: groesserer Shader-Cache fuer NVIDIA (weniger Nachladeruckler in Spielen).
# Der Standard (1 GB) ist fuer moderne Spiele zu klein und wird sonst ausgeraeumt.
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
# Electron-Apps (z. B. Discord) direkt unter Wayland: schaerfer und volle Bildrate
ELECTRON_OZONE_PLATFORM_HINT=auto
