# Biblix Gaming-Tuning (Werte wie bei SteamOS / CachyOS)
# Viele moderne Spiele (z. B. ueber Proton) brauchen sehr viele Speicherbereiche.
vm.max_map_count = 2147483642
# zram ist schneller als Plattenswap, darf also frueh genutzt werden.
vm.swappiness = 150
vm.page-cluster = 0
# Split-Lock-Bremse aus: verhindert Ruckler in manchen Windows-Spielen.
kernel.split_lock_mitigate = 0
# Kein NMI-Watchdog: weniger Interrupts.
kernel.nmi_watchdog = 0
# Weniger Ruckler beim Schreiben grosser Dateien (Spiele-Downloads).
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
